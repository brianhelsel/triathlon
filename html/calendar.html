<div class="tri-calendar">
  <div class="cal-header">
    <h2>{{month_label}}</h2>
    <div class="subtitle">
      Swim &middot; Bike &middot; Run &mdash; plan the week chase the finish
      line
    </div>
  </div>
  <div class="cal-weekdays">
    <div>Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
  </div>
  {{week_rows}}
  <div class="cal-legend">
    <div class="legend-item">
      <span class="dot" style="background: var(--swim)"></span>Swim
    </div>
    <div class="legend-item">
      <span class="dot" style="background: var(--bike)"></span>Bike
    </div>
    <div class="legend-item">
      <span class="dot" style="background: var(--run)"></span>Run
    </div>
    <div class="legend-item">
      <span class="dot" style="background: var(--strength)"></span>Strength
    </div>
    <div class="legend-item">
      <span class="dot" style="background: var(--rest)"></span>Rest
    </div>
    <div class="legend-item">
      <span class="dot" style="background: var(--race)"></span>Race
    </div>
  </div>
</div>
